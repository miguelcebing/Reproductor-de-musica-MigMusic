# Shared response headers. Included per location: Nginx inherits an `add_header`
# from a parent block only when the child defines none, so every location that
# needs these must include this file itself.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Ignored over plain HTTP; takes effect as soon as the certificate is in place.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
