# MigMusic site: static SPA + reverse proxy to the Gunicorn backend.
# Installed as /etc/nginx/conf.d/migmusic.conf (HTTP only; TLS is added in a
# later phase together with Certbot).

upstream migmusic_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Per-IP request budgets. Generous for a human, useless for a scraper.
limit_req_zone $binary_remote_addr zone=migmusic_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=migmusic_auth:10m rate=5r/s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/xhtml+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 64k;

    root /opt/migmusic/frontend/dist;
    index index.html;

    # Vite fingerprints everything under /assets/, so it can be cached hard.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /icons/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Login and OAuth callbacks get a much stricter per-IP budget.
    location /api/auth/ {
        limit_req zone=migmusic_auth burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://migmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API: JSON produced by FastAPI. No page CSP here - the backend sets its own.
    location /api/ {
        limit_req zone=migmusic_api burst=60 nodelay;
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://migmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Liveness probe used by the health check and the uptime monitor.
    location = /health {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://migmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the SPA shell. index.html and the service worker must
    # always revalidate, otherwise a deploy would not reach returning visitors.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.scdn.co https://www.youtube.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.scdn.co https://*.scdn.co https://*.spotifycdn.com https://i.ytimg.com https://*.googleusercontent.com https://*.ytimg.com; media-src 'self' blob: https://*.scdn.co https://*.spotifycdn.com; font-src 'self' data:; connect-src 'self' https://api.spotify.com https://*.spotify.com wss://*.spotify.com https://*.scdn.co https://*.spotifycdn.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://sdk.scdn.co https://*.spotifycdn.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve source maps or dotfiles to the public.
    location ~* \.map$ {
        return 404;
    }
}
