# MigMusic site: static SPA + reverse proxy to the Gunicorn backend.
# Installed as /etc/nginx/conf.d/migmusic.conf.
#
# The TLS material below is part of the file on purpose. Certbot used to add it
# by editing this vhost, but every deploy overwrites the file with the repo copy,
# which silently dropped HTTPS. Keeping the 443 block in the repository makes a
# deploy idempotent: the certificate paths are stable (certbot renews in place)
# and no post-deploy `certbot --nginx` run is needed.
#
# Locations live in migmusic-locations.conf so the HTTP redirect host and the
# HTTPS serving host cannot drift apart.

upstream migmusic_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Per-IP request budgets. Generous for a human, useless for a scraper.
limit_req_zone $binary_remote_addr zone=migmusic_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=migmusic_auth:10m rate=5r/s;

# --- HTTPS: the real site -------------------------------------------------
server {
    # nginx 1.24 (Ubuntu 24.04) has no `http2 on;` directive; HTTP/2 is enabled
    # through the listen flag. On nginx >= 1.25.5 this still works (deprecated
    # but accepted), so one form covers both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name migmusicreproductor.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/migmusicreproductor.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migmusicreproductor.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 64k;

    # Declared here, not at http level: Ubuntu's nginx.conf already sets gzip
    # at http scope and a second one at the same level is a config error.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xhtml+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/snippets/migmusic-locations.conf;
}

# --- HTTP: redirect everything to HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name migmusicreproductor.duckdns.org;

    # Let's Encrypt validates over plain HTTP; never redirect the challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
