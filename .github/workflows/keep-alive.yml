name: Keep-alive

# Render's free plan sleeps after ~15 min without traffic; a cron ping keeps
# the API warm and doubles as a production health monitor (replaces UptimeRobot).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render + Vercel proxy
    runs-on: ubuntu-latest
    steps:
      - name: Backend health (wakes the service)
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 \
              "https://migmusic-api.onrender.com/api/health" || true)
            echo "backend attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::backend /api/health did not answer 200"
          exit 1

      - name: Frontend proxy health (the URL users actually hit)
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
              "https://migmusic.vercel.app/api/health" || true)
            echo "proxy attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::migmusic.vercel.app/api/health did not answer 200"
          exit 1
