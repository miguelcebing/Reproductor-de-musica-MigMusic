[project]
name = "migmusic"
version = "0.1.0"
description = "MigMusic backend - music player API with a doubly linked list core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migmusic"]

# --- Ruff (BACK-003: ruff + mypy) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # pathlib
    "RUF",  # ruff-specific
    "T20",  # no print() in application code
    "S",    # bandit (security)
]
ignore = [
    "S101",   # assert is allowed in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20", "S105", "S106"]
"**/__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["migmusic"]

# --- Mypy (strict for domain and application) ---
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["migmusic"]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = "^(tests)/"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that exercise adapters or the HTTP layer",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
source = ["src/migmusic"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
